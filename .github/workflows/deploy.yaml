name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: sebi-platform-deploy
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cheia SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy pe EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "APP_DIR=${APP_DIR} bash -s" <<'SCRIPT'
          set -euo pipefail
          cd ~/"$APP_DIR"
          git pull --ff-only
          docker compose pull
          docker compose up -d --remove-orphans
          docker compose exec -T nginx nginx -t
          docker compose exec -T nginx nginx -s reload
          for app in shop school solar; do
            code=000
            for i in $(seq 1 36); do
              code=$(curl -s -L -o /dev/null -w '%{http_code}' "http://localhost/$app/swagger-ui.html" || true)
              [ "$code" = 200 ] && break
              sleep 5
            done
            if [ "$code" != 200 ]; then
              echo "$app nu raspunde (ultimul cod: $code)"
              docker compose logs --tail 50 "$app"
              exit 1
            fi
            echo "$app OK"
          done
          docker image prune -f
          SCRIPT
