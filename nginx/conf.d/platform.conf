server {
    listen 80 default_server;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /shop/ {
        proxy_pass http://shop:8082;
    }

    location /school/ {
        proxy_pass http://school:8081;
    }

    location /solar/ {
        proxy_pass http://solar:8081;
    }

    location / {
        return 404;
    }
}
