services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  shop:
    image: sebi123q/sebi-online-schop-api:sha-88b5741
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /shop
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_KEY: ${SHOP_JWT_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  school:
    image: sebi123q/online-school-cloud-api:sha-3cf100d
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /school
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/school_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_KEY: ${SCHOOL_JWT_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  solar:
    image: sebi123q/solarsyncbroker-app:sha-b27876a
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /solar
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/solar_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET_KEY: ${SOLAR_JWT_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - shop
      - school
      - solar
    restart: unless-stopped

volumes:
  mysql_data:
